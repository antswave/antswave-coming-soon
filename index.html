<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2a0560" />
    <meta name="description" content="Ants Wave — আসছে খুব শীঘ্রই. Our new website is launching soon." />
    <title>Ants Wave — Coming Soon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.maateen.me/mukti/font.css" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { brand: { DEFAULT: "#ff5753", deep: "#2a0560", mid: "#4a0a9c" } },
            fontFamily: { sans: ["Poppins", "Mukti", "Arial", "sans-serif"], bn: ["Mukti", "Poppins", "sans-serif"] },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body class="bg-brand-deep font-sans text-white antialiased">
    <div id="page" class="page relative isolate flex flex-col overflow-hidden">
      <!-- ===== Animated background ===== -->
      <div class="pointer-events-none absolute inset-0 -z-10" aria-hidden="true">
        <div class="parallax-layer" style="--depth: 30">
          <div class="orb orb-1"></div>
          <div class="orb orb-2"></div>
          <div class="orb orb-3"></div>
        </div>
        <div class="grid-overlay"></div>
        <div id="stars" class="parallax-layer" style="--depth: 12"></div>
        <div class="spotlight"></div>
      </div>

      <!-- ===== Header ===== -->
      <header class="relative z-20 mx-auto flex w-full max-w-7xl items-center justify-between px-4 pt-5 sm:px-8 lg:px-[8%]">
        <a href="./" class="reveal text-xl font-semibold tracking-tight" style="--d: 0" aria-label="Ants Wave home">
          Ants<span class="text-brand">Wave</span>
        </a>
        <p class="reveal hidden items-center gap-2 rounded-full border border-white/15 bg-white/5 px-4 py-1.5 text-sm text-white/80 backdrop-blur-md sm:flex" style="--d: 1">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M16 3v4M8 3v4M3 11h18" /></svg>
          Launch: 1 Dec 2026
        </p>
      </header>

      <!-- ===== Hero ===== -->
      <main class="relative z-10 mx-auto flex w-full max-w-7xl min-h-0 flex-1 flex-col items-center justify-center px-4 pt-6 pb-[26svh] text-center sm:px-8 lg:px-[8%]">
        <p class="reveal badge mb-5 inline-flex items-center gap-2 rounded-full px-4 py-1.5 text-[0.7rem] font-medium tracking-[0.25em] uppercase sm:text-xs" style="--d: 1">
          <span class="pulse-dot h-2 w-2 rounded-full bg-brand"></span>
          Something big is coming
        </p>

        <h1 class="reveal text-[clamp(1.9rem,min(8vw,9svh),5rem)] leading-[1.1] font-semibold tracking-tight" style="--d: 2">
          <span class="split-words">Welcome to</span>
          <span class="brand-wave block whitespace-nowrap sm:inline" aria-label="Ants Wave">
            <span aria-hidden="true" style="--i: 0">A</span><span aria-hidden="true" style="--i: 1">n</span><span aria-hidden="true" style="--i: 2">t</span><span aria-hidden="true" style="--i: 3">s</span><span aria-hidden="true" style="--i: 4">&nbsp;</span><span aria-hidden="true" style="--i: 5">W</span><span aria-hidden="true" style="--i: 6">a</span><span aria-hidden="true" style="--i: 7">v</span><span aria-hidden="true" style="--i: 8">e</span>
          </span>
        </h1>

        <p class="reveal mt-4 font-bn text-[clamp(1.2rem,min(4.5vw,6svh),2rem)] text-white/85" style="--d: 3">
          আসছে খুব শীঘ্রই<span class="typing-dots"><span>.</span><span>.</span><span>.</span></span>
        </p>

        <!-- Countdown -->
        <div class="mt-9 grid w-full max-w-md grid-cols-4 gap-2 sm:max-w-2xl sm:gap-4" role="timer" aria-label="Time left until launch">
          <div class="reveal time-card" style="--d: 4">
            <p id="days" class="time-num">00</p>
            <span class="time-label">Days</span>
          </div>
          <div class="reveal time-card" style="--d: 4.5">
            <p id="hours" class="time-num">00</p>
            <span class="time-label">Hours</span>
          </div>
          <div class="reveal time-card" style="--d: 5">
            <p id="minutes" class="time-num">00</p>
            <span class="time-label">Minutes</span>
          </div>
          <div class="reveal time-card" style="--d: 5.5">
            <p id="seconds" class="time-num">00</p>
            <span class="time-label">Seconds</span>
          </div>
        </div>

        <!-- Progress to launch -->
        <div class="reveal mt-6 w-full max-w-md sm:max-w-2xl" style="--d: 6">
          <div class="h-1.5 w-full overflow-hidden rounded-full bg-white/10">
            <div id="progress" class="progress-bar h-full rounded-full" style="width: 0%"></div>
          </div>
        </div>

        <button
          id="status-btn"
          type="button"
          class="reveal cta group mt-9 inline-flex items-center gap-3 rounded-full px-7 py-3.5 text-base font-medium sm:text-lg"
          style="--d: 7"
        >
          <span id="status-text">Just a few days left</span>
          <img src="images/triangle.png" alt="" class="w-3.5 transition-transform duration-300 group-hover:translate-x-1" />
        </button>
      </main>

      <!-- Ant shape (top-down view, facing right) used by the wandering ants -->
      <svg width="0" height="0" class="absolute" aria-hidden="true">
        <symbol id="ant" viewBox="0 0 40 30">
          <g class="legs-a" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none">
            <path d="M18 15 L13 5" /><path d="M20 15 L26 25" /><path d="M21 15 L22 4" /><path d="M17 15 L10 25" /><path d="M22 15 L29 6" /><path d="M16 15 L6 22" />
          </g>
          <g class="legs-b" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none">
            <path d="M18 15 L11 7" /><path d="M20 15 L24 26" /><path d="M21 15 L25 5" /><path d="M17 15 L12 26" /><path d="M22 15 L30 9" /><path d="M16 15 L5 19" />
          </g>
          <path d="M31 13 Q35 8 39 7 M31 17 Q35 22 39 23" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" fill="none" />
          <ellipse cx="8" cy="15" rx="8" ry="5.5" fill="#ffffff" />
          <ellipse cx="19" cy="15" rx="4.5" ry="3" fill="#ffffff" />
          <circle cx="28" cy="15" r="4" fill="#ffffff" />
          <!-- food crumb carried in the jaws -->
          <circle class="crumb" cx="35.5" cy="15" r="3.6" fill="#ffb199" />
        </symbol>
      </svg>

      <!-- Wandering ants (spawned in script.js) -->
      <div id="ants" class="pointer-events-none fixed inset-0 z-30 overflow-hidden" aria-hidden="true"></div>

      <!-- ===== Ants Wave: thousands of tiny "ants" moving together as one wave ===== -->
      <canvas id="ant-wave" class="ant-wave pointer-events-none absolute inset-x-0 bottom-0 z-0 w-full" aria-hidden="true"></canvas>

      <footer class="reveal absolute inset-x-0 bottom-3 z-10 px-4 text-center text-[0.7rem] text-white/50 sm:bottom-5 sm:text-xs" style="--d: 8">
        <span class="hidden sm:inline">Small ants. Big wave. &nbsp;·&nbsp; </span><span class="hidden sm:inline">Click</span><span class="sm:hidden">Tap</span> anywhere to feed the ants &nbsp;·&nbsp; © 2026 Ants Wave
      </footer>
    </div>

    <script src="./js/script.js"></script>
  </body>
</html>
