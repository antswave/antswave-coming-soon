<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4a0a9c" />
    <meta name="description" content="Ants Wave — আসছে খুব শীঘ্রই. Our new website is launching soon." />
    <title>Ants Wave — Coming Soon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.maateen.me/mukti/font.css" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { brand: { DEFAULT: "#ff5753", deep: "#2a0560", mid: "#4a0a9c" } },
            fontFamily: { sans: ["Poppins", "Mukti", "Arial", "sans-serif"], bn: ["Mukti", "Poppins", "sans-serif"] },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body class="bg-brand-deep font-sans text-white antialiased">
    <div class="page relative isolate flex min-h-[100svh] flex-col overflow-hidden">
      <!-- Twinkling stars (generated in script.js) -->
      <div id="stars" class="pointer-events-none absolute inset-0 -z-10" aria-hidden="true"></div>

      <!-- Rocket -->
      <img
        src="images/rocket.png"
        alt=""
        aria-hidden="true"
        class="rocket pointer-events-none absolute right-[6%] bottom-0 -z-10 w-20 opacity-60 sm:w-28 sm:opacity-80 md:right-[10%] lg:w-44 lg:opacity-100 xl:w-52"
      />

      <!-- Main content -->
      <main
        class="relative z-10 mx-auto flex w-full max-w-7xl flex-1 flex-col items-center justify-center px-4 pt-12 pb-40 text-center sm:px-8 sm:pb-48 lg:items-start lg:px-[8%] lg:pb-52 lg:text-left"
      >
        <p class="reveal mb-3 inline-flex items-center gap-2 rounded-full border border-white/20 bg-white/10 px-4 py-1.5 text-xs font-medium tracking-[0.2em] uppercase backdrop-blur-sm sm:text-sm" style="--d: 0">
          <span class="pulse-dot h-2 w-2 rounded-full bg-brand"></span>
          Launching soon
        </p>

        <h1 class="reveal text-[clamp(2rem,8vw,4.5rem)] leading-tight font-semibold" style="--d: 1">
          Welcome to
          <span class="brand-wave whitespace-nowrap text-brand" aria-label="Ants Wave">
            <span aria-hidden="true" style="--i: 0">A</span><span aria-hidden="true" style="--i: 1">n</span><span aria-hidden="true" style="--i: 2">t</span><span aria-hidden="true" style="--i: 3">s</span><span aria-hidden="true" style="--i: 4">&nbsp;</span><span aria-hidden="true" style="--i: 5">W</span><span aria-hidden="true" style="--i: 6">a</span><span aria-hidden="true" style="--i: 7">v</span><span aria-hidden="true" style="--i: 8">e</span>
          </span>
        </h1>

        <p class="reveal mt-3 font-bn text-[clamp(1.25rem,4.5vw,2rem)] text-white/90" style="--d: 2">আসছে খুব শীঘ্রই,</p>

        <!-- Countdown -->
        <div class="reveal mt-8 grid w-full max-w-md grid-cols-4 gap-2 sm:max-w-xl sm:gap-4" style="--d: 3" role="timer" aria-label="Time left until launch">
          <div class="time-card">
            <p id="days" class="time-num">00</p>
            <span class="time-label">Days</span>
          </div>
          <div class="time-card">
            <p id="hours" class="time-num">00</p>
            <span class="time-label">Hours</span>
          </div>
          <div class="time-card">
            <p id="minutes" class="time-num">00</p>
            <span class="time-label">Minutes</span>
          </div>
          <div class="time-card">
            <p id="seconds" class="time-num">00</p>
            <span class="time-label">Seconds</span>
          </div>
        </div>

        <button
          id="status-btn"
          type="button"
          class="reveal group mt-8 inline-flex items-center gap-3 rounded-lg border-2 border-white px-6 py-3 text-base font-medium transition duration-300 hover:-translate-y-0.5 hover:border-brand hover:bg-brand hover:shadow-[0_10px_30px_-10px_#ff5753] focus-visible:ring-4 focus-visible:ring-brand/50 focus-visible:outline-none sm:text-lg"
          style="--d: 4"
        >
          <span id="status-text">Just a few days left</span>
          <img src="images/triangle.png" alt="" class="w-3.5 transition-transform duration-300 group-hover:translate-x-1" />
        </button>
      </main>

      <!-- Ants Wave: marching ants riding the waves -->
      <div class="pointer-events-none absolute inset-x-0 bottom-0 z-0" aria-hidden="true">
        <svg width="0" height="0" class="absolute">
          <defs>
            <symbol id="ant" viewBox="0 0 40 24">
              <g class="ant-legs-a" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none">
                <path d="M14 13 L9 21" /><path d="M17 13 L19 21" /><path d="M20 13 L27 20" />
              </g>
              <g class="ant-legs-b" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none">
                <path d="M14 13 L11 21" /><path d="M17 13 L15 21" /><path d="M20 13 L24 21" />
              </g>
              <path d="M29 8 Q32 2 36 1 M28 8 Q30 3 33 1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none" />
              <ellipse cx="7" cy="13" rx="7" ry="5" fill="currentColor" />
              <ellipse cx="17" cy="12" rx="4" ry="3" fill="currentColor" />
              <circle cx="26" cy="10" r="4" fill="currentColor" />
            </symbol>
          </defs>
        </svg>

        <div class="ants absolute inset-x-0">
          <svg class="ant" style="--delay: 0s; --dur: 22s"><use href="#ant" /></svg>
          <svg class="ant" style="--delay: -1.1s; --dur: 22s"><use href="#ant" /></svg>
          <svg class="ant" style="--delay: -2.2s; --dur: 22s"><use href="#ant" /></svg>
          <svg class="ant" style="--delay: -9s; --dur: 22s"><use href="#ant" /></svg>
          <svg class="ant" style="--delay: -10.2s; --dur: 22s"><use href="#ant" /></svg>
          <svg class="ant" style="--delay: -16s; --dur: 22s"><use href="#ant" /></svg>
        </div>

        <svg class="waves block w-full" viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
          <defs>
            <path id="wave" d="M-160 44c30 0 58-18 88-18s58 18 88 18 58-18 88-18 58 18 88 18v44h-352z" />
          </defs>
          <g class="parallax">
            <use href="#wave" x="48" y="0" fill="rgba(255,87,83,0.35)" />
            <use href="#wave" x="48" y="3" fill="rgba(140,60,230,0.45)" />
            <use href="#wave" x="48" y="5" fill="rgba(255,87,83,0.25)" />
            <use href="#wave" x="48" y="7" fill="#2a0560" />
          </g>
        </svg>
        <div class="h-[env(safe-area-inset-bottom)] bg-brand-deep"></div>
      </div>
    </div>

    <script src="./js/script.js"></script>
  </body>
</html>
