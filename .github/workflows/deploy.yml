name: Check & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint HTML
        run: npx --yes htmlhint@1.1.4 "**/*.html"

      - name: Check JavaScript syntax
        run: |
          for f in $(find . -name '*.js' -not -path './node_modules/*'); do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Verify local asset references exist
        run: |
          missing=0
          for ref in $(grep -ohE '(src|href)="[^"#:?]+"' index.html | sed -E 's/^(src|href)="//; s/"$//'); do
            path="${ref#./}"
            [ -z "$path" ] && continue
            if [ ! -e "$path" ]; then
              echo "::error file=index.html::Missing asset: $ref"
              missing=1
            fi
          done
          exit $missing

  deploy:
    name: Deploy
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir _site
          cp -r index.html css js images _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
